<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Item Registry</title>
    <!-- Load ethers.js FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>


</head>
<body>
    <h1>Item Registry DApp</h1>

    <button id="connectButton">Connect Wallet</button>

    <div>
        <h3>Register Item</h3>
        <input type="text" id="itemName" placeholder="Item Name">
        <button id="registerButton">Register</button>
    </div>

    <div>
        <h3>Transfer Ownership</h3>
        <input type="number" id="itemId" placeholder="Item ID">
        <input type="text" id="newOwner" placeholder="New Owner Address">
        <button id="transferButton">Transfer</button>
    </div>

    

    <!-- Load your app.js AFTER ethers.js -->
    <script src="app.js"></script>
</body>
</html>
